<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貸款聲明書套印工具 - 永豐銀行</title>
<style>
  :root{
    --red:#c0392b;
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#dcdfe4;
    --text:#2b2f36;
    --accent:#2563eb;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,#c0392b,#992d22);
    color:#fff;
    padding:14px 20px;
  }
  header h1{margin:0;font-size:18px;font-weight:600;}
  header p{margin:4px 0 0;font-size:12px;opacity:.85;}
  .layout{
    display:flex;
    gap:16px;
    padding:16px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .controls{
    width:340px;
    flex:0 0 340px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .section-title{
    font-size:13px;
    font-weight:700;
    color:var(--red);
    margin:0 0 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px;}
  input[type=text]{
    width:100%;
    padding:7px 9px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
  }
  .row{margin-bottom:12px;}
  .check-group{display:flex;flex-direction:column;gap:6px;}
  .check-item{
    display:flex;align-items:center;gap:6px;
    font-size:13px;color:var(--text);
    cursor:pointer;
  }
  .check-item input{width:auto;margin:0;}
  .btn{
    display:inline-block;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:12.5px;
    color:var(--text);
  }
  .btn:hover{background:#f0f1f3;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#1d4ed8;}
  .btn.danger{color:#c0392b;border-color:#f1c0b8;}
  .btn.small{padding:4px 8px;font-size:11.5px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .canvas-wrap{
    flex:1 1 380px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  #slipCanvas{
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    max-width:100%;
    height:auto;
    width:380px;
    cursor:default;
  }
  #slipCanvas.calib{cursor:crosshair;}
  .hint{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    background:#fff7ed;
    border:1px solid #fde3c0;
    padding:8px 10px;
    border-radius:8px;
  }
  .calib-field{
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    background:#fafbfc;
  }
  .calib-field .ttl{font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text);}
  .calib-field .grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }
  .calib-field .grid3 label{font-size:10.5px;margin-bottom:2px;}
  .calib-field input{padding:4px 5px;font-size:12px;}
  .badge{
    display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;
    background:#eef2ff;color:#3730a3;
  }
  .divider{height:1px;background:var(--border);margin:10px 0;}
  .footer-note{font-size:11px;color:var(--muted);text-align:center;max-width:380px;}
  details.panel > summary{list-style:none;cursor:pointer;}
  details.panel > summary::-webkit-details-marker{display:none;}
  details.panel > summary::after{
    content:'▾';
    font-size:11px;
    color:var(--muted);
    margin-left:8px;
  }
  details.panel[open] > summary::after{content:'▴';}
  details.panel > summary{margin-bottom:0;}
  details.panel[open] > summary{margin-bottom:8px;}
</style>
</head>
<body>
<header>
  <h1>貸款聲明書套印工具｜永豐銀行 Bank SinoPac</h1>
  <p>輸入戶名、身分證字號並勾選資金用途／確認方式 → 匯出合併圖片。文字與勾選位置為初版估算值，可用「校正模式」微調對齊。</p>
</header>

<div class="layout">
  <div class="controls">

    <div class="panel">
      <div class="section-title">① 填單內容</div>
      <div class="row">
        <label>從 Excel 匯入（姓名／身分證字號）</label>
        <div class="btn-row">
          <button class="btn small" id="importXlsxBtn">選擇 Excel 檔案</button>
          <input type="file" id="importXlsxFile" accept=".xlsx,.xls" style="display:none;">
        </div>
        <select id="xlsxRecordSelect" style="display:none;margin-top:6px;width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;"></select>
      </div>
      <div class="row">
        <label>聲明人姓名</label>
        <input type="text" id="nameInput" placeholder="請輸入戶名">
      </div>
      <div class="row">
        <label>身分證統一編號</label>
        <input type="text" id="idNumberInput" placeholder="例如 A123456789" maxlength="10">
      </div>
      <div class="row">
        <label>資金用途聲明（可複選）</label>
        <div class="check-group">
          <label class="check-item"><input type="checkbox" class="fundUseCheck" value="insurance"> 購買保險商品</label>
          <label class="check-item"><input type="checkbox" class="fundUseCheck" value="invest"> 其他投資理財</label>
          <label class="check-item"><input type="checkbox" class="fundUseCheck" value="working"> 家庭週轉金/營運週轉金</label>
        </div>
      </div>
      <div class="row">
        <label>確認方式（單選）</label>
        <div class="check-group">
          <label class="check-item"><input type="radio" name="confirmMethod" class="confirmMethodRadio" value="phone"> 電話確認</label>
          <label class="check-item"><input type="radio" name="confirmMethod" class="confirmMethodRadio" value="inperson"> 當面確認</label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">② 匯出</div>
      <div class="btn-row">
        <button class="btn primary" id="exportBtn">下載合併圖片 (PNG)</button>
        <button class="btn" id="printBtn">開啟列印預覽</button>
      </div>
    </div>

    <details class="panel">
      <summary class="section-title">
        ③ 校正模式
        <span class="badge" id="calibBadge">關閉</span>
      </summary>
      <div class="hint">
        開啟校正模式後，可在畫布上拖曳各欄位（含勾選框）的錨點，或用下方數值/方向鍵微調對齊，完成後按「儲存校正」。
      </div>
      <div class="btn-row" style="margin:8px 0;">
        <button class="btn" id="toggleCalibBtn">開啟校正模式</button>
        <button class="btn" id="saveCalibBtn">儲存校正</button>
        <button class="btn danger" id="resetCalibBtn">還原預設值</button>
      </div>
      <div id="calibPanel" style="display:none;">
        <label>選取欄位（可用方向鍵微調，Shift+方向鍵=5px）</label>
        <select id="fieldSelect"></select>
        <div id="calibFields"></div>
        <div class="divider"></div>
        <label>校正設定備份</label>
        <div class="btn-row">
          <button class="btn small" id="exportCalibBtn">匯出校正設定 (JSON)</button>
          <button class="btn small" id="importCalibBtn">匯入校正設定 (JSON)</button>
          <input type="file" id="importCalibFile" accept=".json,application/json" style="display:none;">
        </div>
      </div>
    </details>

  </div>

  <div class="canvas-wrap">
    <canvas id="slipCanvas" width="1152" height="1603"></canvas>
    <div class="footer-note">畫面僅為預覽比例，實際匯出為原始解析度 1152×1603px。列印或送出前請先確認欄位對齊正確。</div>
  </div>
</div>

function loadConfig(){
  try{
    const raw = localStorage.getItem('loanStatement_config');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), parsed);
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
}
function saveConfigToStorage(){
  localStorage.setItem('loanStatement_config', JSON.stringify(config));
}

/* ===================== 背景圖 ===================== */
const bgImage = new Image();
bgImage.src = 'data:image/png;base64,' + BG_BASE64;
bgImage.onload = render;

/* ===================== 取得目前表單值 ===================== */
function getFormValues(){
  return {
    name: document.getElementById('nameInput').value,
    idNumber: document.getElementById('idNumberInput').value,
    use_insurance: document.querySelector('.fundUseCheck[value="insurance"]').checked,
    use_invest: document.querySelector('.fundUseCheck[value="invest"]').checked,
    use_working: document.querySelector('.fundUseCheck[value="working"]').checked,
    confirm_phone: document.querySelector('.confirmMethodRadio[value="phone"]').checked,
    confirm_inperson: document.querySelector('.confirmMethodRadio[value="inperson"]').checked
  };
}

/* ===================== 繪圖 ===================== */
function render(){
  const canvas = document.getElementById('slipCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  if(bgImage.complete && bgImage.naturalWidth){
    ctx.drawImage(bgImage,0,0,CANVAS_W,CANVAS_H);
  }
  const vals = getFormValues();
  ctx.fillStyle = INK_COLOR;
  ctx.textBaseline = 'alphabetic';

  drawText('name', vals.name);
  drawText('idNumber', vals.idNumber.toUpperCase());

  if(vals.use_insurance) drawMark('use_insurance');
  if(vals.use_invest) drawMark('use_invest');
  if(vals.use_working) drawMark('use_working');
  if(vals.confirm_phone) drawMark('confirm_phone');
  if(vals.confirm_inperson) drawMark('confirm_inperson');

  if(calibOn) drawCalibOverlay(ctx);
}

function drawText(key, value){
  if(!value) return;
  const c = config[key];
  const ctx = document.getElementById('slipCanvas').getContext('2d');
  ctx.font = c.fontSize + 'px ' + FONT_FAMILY;
  ctx.textAlign = c.align || 'left';
  ctx.fillStyle = INK_COLOR;
  ctx.fillText(value, c.x, c.y);
}

function drawMark(key){
  const c = config[key];
  const ctx = document.getElementById('slipCanvas').getContext('2d');
  ctx.font = 'bold ' + c.fontSize + 'px ' + FONT_FAMILY;
  ctx.textAlign = 'center';
  ctx.fillStyle = INK_COLOR;
  ctx.fillText('✓', c.x, c.y);
}

function drawCalibOverlay(ctx){
  Object.keys(config).forEach(key=>{
    const c = config[key];
    ctx.save();
    ctx.strokeStyle = key === selectedField ? '#2563eb' : '#16a34a';
    ctx.fillStyle = key === selectedField ? '#2563eb' : '#16a34a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 6, 0, Math.PI*2);
    ctx.fill();
    if(c.type === 'mark'){
      ctx.strokeRect(c.x - c.fontSize/2, c.y - c.fontSize, c.fontSize, c.fontSize*1.3);
    } else {
      const w = 220;
      const bx = (c.align === 'right') ? c.x - w : c.x;
      ctx.strokeRect(bx, c.y - c.fontSize, w, c.fontSize*1.3);
    }
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(FIELD_LABELS[key], c.x, c.y - c.fontSize - 6);
    ctx.restore();
  });
}

/* ===================== 校正模式互動 ===================== */
function fieldAnchor(key){ return { x: config[key].x, y: config[key].y }; }

function canvasCoordsFromEvent(evt){
  const canvas = document.getElementById('slipCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const clientX = (evt.touches ? evt.touches[0].clientX : evt.clientX);
  const clientY = (evt.touches ? evt.touches[0].clientY : evt.clientY);
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function setupCanvasDrag(){
  const canvas = document.getElementById('slipCanvas');
  canvas.addEventListener('mousedown', (evt)=>{
    if(!calibOn) return;
    const pos = canvasCoordsFromEvent(evt);
    let closest = null, closestDist = 40;
    Object.keys(config).forEach(key=>{
      const a = fieldAnchor(key);
      const dist = Math.hypot(a.x - pos.x, a.y - pos.y);
      if(dist < closestDist){ closestDist = dist; closest = key; }
    });
    if(closest){
      draggingKey = closest;
      selectedField = closest;
      syncFieldSelectUI();
      renderCalibFieldInputs();
    }
  });
  window.addEventListener('mousemove', (evt)=>{
    if(!calibOn || !draggingKey) return;
    const pos = canvasCoordsFromEvent(evt);
    config[draggingKey].x = Math.round(pos.x*10)/10;
    config[draggingKey].y = Math.round(pos.y*10)/10;
    render();
    renderCalibFieldInputs();
  });
  window.addEventListener('mouseup', ()=>{ draggingKey = null; });
}

function syncFieldSelectUI(){
  document.getElementById('fieldSelect').value = selectedField;
}

document.addEventListener('keydown', (evt)=>{
  if(!calibOn) return;
  const step = evt.shiftKey ? 5 : 1;
  let handled = true;
  switch(evt.key){
    case 'ArrowLeft': config[selectedField].x -= step; break;
    case 'ArrowRight': config[selectedField].x += step; break;
    case 'ArrowUp': config[selectedField].y -= step; break;
    case 'ArrowDown': config[selectedField].y += step; break;
    default: handled = false;
  }
  if(handled){
    evt.preventDefault();
    render();
    renderCalibFieldInputs();
  }
});

/* ===================== 校正面板 UI ===================== */
function renderFieldSelectOptions(){
  const sel = document.getElementById('fieldSelect');
  sel.innerHTML = '';
  Object.keys(config).forEach(key=>{
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = FIELD_LABELS[key];
    sel.appendChild(opt);
  });
  sel.value = selectedField;
  sel.onchange = ()=>{ selectedField = sel.value; render(); renderCalibFieldInputs(); };
}

function renderCalibFieldInputs(){
  const wrap = document.getElementById('calibFields');
  wrap.innerHTML = '';
  const key = selectedField;
  const c = config[key];
  const hasAlign = c.type === 'text';
  const div = document.createElement('div');
  div.className = 'calib-field';
  div.innerHTML = `
    <div class="ttl">${FIELD_LABELS[key]}</div>
    <div class="grid3">
      <div><label>X</label><input type="number" step="0.5" id="cf_x" value="${c.x}"></div>
      <div><label>Y</label><input type="number" step="0.5" id="cf_y" value="${c.y}"></div>
      <div><label>字級</label><input type="number" step="1" id="cf_fontSize" value="${c.fontSize}"></div>
    </div>
    ${hasAlign ? `<div class="grid3" style="margin-top:6px;">
      <div><label>對齊</label><select id="cf_align">
        <option value="left" ${c.align==='left'?'selected':''}>靠左</option>
        <option value="right" ${c.align==='right'?'selected':''}>靠右</option>
      </select></div>
    </div>` : ''}
  `;
  wrap.appendChild(div);

  const bindNum = (id, prop, isInt)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      const v = parseFloat(el.value);
      if(!isNaN(v)) config[key][prop] = isInt ? Math.round(v) : v;
      render();
    });
  };
  bindNum('cf_x','x'); bindNum('cf_y','y');
  bindNum('cf_fontSize','fontSize', true);
  if(hasAlign){
    document.getElementById('cf_align').addEventListener('change', (e)=>{
      config[key].align = e.target.value;
      render();
    });
  }
}

/* ===================== Excel 匯入（姓名／身分證字號） ===================== */
let xlsxRecords = [];

// 欄名關鍵字比對：只要欄位標題包含這些關鍵字之一即可，不需完全相同
const ID_COL_KEYWORDS = ['身分證字號','身分證統一編號','統一編號','身分證'];
const NAME_COL_KEYWORDS = ['姓名','戶名','聲明人'];

function findColumnIndex(header, keywords){
  for(const kw of keywords){
    const idx = header.findIndex(h => h.includes(kw));
    if(idx > -1) return idx;
  }
  return -1;
}

function handleXlsxImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      if(!rows.length){ alert('Excel 檔案沒有資料'); return; }
      const header = rows[0].map(h => String(h||'').trim());
      const idCol = findColumnIndex(header, ID_COL_KEYWORDS);
      const nameCol = findColumnIndex(header, NAME_COL_KEYWORDS);
      if(idCol === -1){
        alert('找不到「身分證字號」欄位，請確認 Excel 格式');
        return;
      }
      xlsxRecords = [];
      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        if(!r || r.every(v => v === '' || v === undefined)) continue;
        const idVal = String(r[idCol] || '').trim();
        if(!idVal) continue;
        xlsxRecords.push({
          name: nameCol > -1 ? String(r[nameCol] || '').trim() : '',
          id: idVal
        });
      }
      if(!xlsxRecords.length){ alert('Excel 檔案沒有可用資料列'); return; }
      const sel = document.getElementById('xlsxRecordSelect');
      sel.innerHTML = '';
      xlsxRecords.forEach((rec, idx)=>{
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${rec.name || '(無姓名)'} - ${rec.id}`;
        sel.appendChild(opt);
      });
      if(xlsxRecords.length > 1){
        sel.style.display = 'block';
      } else {
        sel.style.display = 'none';
      }
      applyXlsxRecord(0);
    }catch(err){
      alert('讀取 Excel 檔案失敗，請確認檔案格式：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
function applyXlsxRecord(idx){
  const rec = xlsxRecords[idx];
  if(!rec) return;
  document.getElementById('nameInput').value = rec.name;
  document.getElementById('idNumberInput').value = rec.id;
  render();
}

/* ===================== 校正設定 匯出/匯入 (JSON) ===================== */
function exportCalibSettings(){
  const json = JSON.stringify(config, null, 2);
  const blob = new Blob([json], {type:'application/json;charset=utf-8;'});
  const link = document.createElement('a');
  link.download = '貸款聲明書套印_校正設定.json';
  link.href = URL.createObjectURL(blob);
  link.click();
}
function importCalibSettings(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      const newConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      Object.keys(newConfig).forEach(key=>{
        if(parsed[key]){
          const c = newConfig[key];
          const p = parsed[key];
          if(typeof p.x === 'number') c.x = p.x;
          if(typeof p.y === 'number') c.y = p.y;
          if(typeof p.fontSize === 'number') c.fontSize = p.fontSize;
          if(p.align === 'left' || p.align === 'right') c.align = p.align;
        }
      });
      config = newConfig;
      saveConfigToStorage();
      renderFieldSelectOptions();
      renderCalibFieldInputs();
      render();
      alert('校正設定已匯入完成');
    }catch(err){
      alert('匯入失敗，請確認為本工具匯出的 JSON 檔案');
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

/* ===================== 事件綁定 ===================== */
function bindFormEvents(){
  ['nameInput','idNumberInput'].forEach(id=>{
    document.getElementById(id).addEventListener('input', render);
  });
  document.querySelectorAll('.fundUseCheck').forEach(el=>{
    el.addEventListener('change', render);
  });
  document.querySelectorAll('.confirmMethodRadio').forEach(el=>{
    el.addEventListener('change', render);
  });

  document.getElementById('importXlsxBtn').addEventListener('click', ()=>{
    document.getElementById('importXlsxFile').click();
  });
  document.getElementById('importXlsxFile').addEventListener('change', handleXlsxImport);
  document.getElementById('xlsxRecordSelect').addEventListener('change', (e)=>{
    applyXlsxRecord(parseInt(e.target.value, 10));
  });

  document.getElementById('exportCalibBtn').addEventListener('click', exportCalibSettings);
  document.getElementById('importCalibBtn').addEventListener('click', ()=>{
    document.getElementById('importCalibFile').click();
  });
  document.getElementById('importCalibFile').addEventListener('change', importCalibSettings);

  document.getElementById('toggleCalibBtn').addEventListener('click', ()=>{
    calibOn = !calibOn;
    document.getElementById('calibPanel').style.display = calibOn ? 'block' : 'none';
    document.getElementById('calibBadge').textContent = calibOn ? '開啟' : '關閉';
    document.getElementById('toggleCalibBtn').textContent = calibOn ? '關閉校正模式' : '開啟校正模式';
    document.getElementById('slipCanvas').classList.toggle('calib', calibOn);
    if(calibOn){ renderFieldSelectOptions(); renderCalibFieldInputs(); }
    render();
  });
  document.getElementById('saveCalibBtn').addEventListener('click', ()=>{
    saveConfigToStorage();
    flashBtn('saveCalibBtn','已儲存');
  });
  document.getElementById('resetCalibBtn').addEventListener('click', ()=>{
    if(!confirm('確定要還原成預設校正值嗎？此動作無法復原。')) return;
    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    saveConfigToStorage();
    renderFieldSelectOptions();
    renderCalibFieldInputs();
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', exportPng);
  document.getElementById('printBtn').addEventListener('click', printSlip);
}

function flashBtn(id, text){
  const btn = document.getElementById(id);
  const orig = btn.textContent;
  btn.textContent = text;
  setTimeout(()=>{ btn.textContent = orig; }, 1200);
}

/* ===================== 匯出 ===================== */
function exportPng(){
  const canvas = document.getElementById('slipCanvas');
  const vals = getFormValues();
  const nameStr = (vals.name || '貸款聲明書').replace(/[\\/:*?"<>|]/g,'');
  const link = document.createElement('a');
  link.download = `貸款聲明書_${nameStr}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
function printSlip(){
  const canvas = document.getElementById('slipCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>列印貸款聲明書</title>
    <style>
      @page{ margin:0; }
      body{ margin:0; display:flex; justify-content:center; align-items:flex-start; }
      img{ width:794px; height:auto; }
      @media print{ img{ width:100%; height:auto; } }
    </style>
    </head><body>
    <img src="${dataUrl}" onload="window.focus(); window.print();">
    </body></html>
  `);
  w.document.close();
}

/* ===================== 初始化 ===================== */
function init(){
  renderFieldSelectOptions();
  bindFormEvents();
  setupCanvasDrag();
  render();
}
init();

</script>
